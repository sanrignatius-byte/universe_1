services:
  observatory:
    build: .
    image: cosmos-observatory:latest
    container_name: cosmos-observatory
    ports:
      - "8000:8000"          # generator posts to http://host.docker.internal:8000/ingest
    volumes:
      - cosmos-data:/data    # SQLite database + WAL (persistent, not a host bind mount)
    environment:
      SQLITE_SYNC: ${SQLITE_SYNC:-FULL}   # FULL = fsync before every ack (default); NORMAL = faster, crash-safe but not power-loss-safe
    cpus: 4
    mem_limit: 4g
    memswap_limit: 4g
    init: true               # tini as PID 1: a crashed server process ends the container, so the restart policy applies
    restart: unless-stopped
    logging:                 # bounded logs: they count against the same disk budget
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    stop_grace_period: 30s

volumes:
  cosmos-data: {}
